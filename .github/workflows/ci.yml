name: Verify synthetic ledger
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shiksham
          POSTGRES_USER: shiksham_owner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U shiksham_owner -d shiksham"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22", cache: npm}
      - name: Install locked dependencies
        run: |
          pip install -r apps/api/requirements.lock -r apps/api/requirements-dev.lock
          npm ci
      - name: Generate private local environment and bootstrap
        env:
          PYTHONPATH: apps/api:.
        run: |
          python scripts/demo.py init-env --native
          python -m app.cli bootstrap --students 200
          python scripts/acceptance.py
      - name: API checks
        env:
          PYTHONPATH: apps/api:.
        run: |
          python scripts/check_placeholders.py
          python scripts/check_schema.py
          python -m ruff check --config apps/api/pyproject.toml apps/api/app
          python -m mypy --config-file apps/api/pyproject.toml apps/api/app
          python -m pytest apps/api/tests -q
      - name: Web and generated schema
        env:
          PYTHONPATH: apps/api:.
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm run api:generate
          git diff --exit-code -- packages/api-client/openapi.json apps/web/src/lib/generated/api.d.ts
      - name: Browser checks
        env:
          PYTHONPATH: apps/api:.
          PLAYWRIGHT_BROWSERS_PATH: .local/browsers
        run: |
          npx playwright install --with-deps chromium
          python scripts/launch.py api > /tmp/shiksham-api.log 2>&1 &
          python scripts/launch.py web > /tmp/shiksham-web.log 2>&1 &
          python scripts/wait_ready.py
          npm run e2e
      - name: Exact artifacts remain a required gate
        run: python scripts/check_artifacts.py
